name: ForgeOS worker host agent checks
on:
  push:
    paths:
      - "worker-host/**"
      - ".github/workflows/worker-host-check.yml"
  pull_request:
    paths:
      - "worker-host/**"
      - ".github/workflows/worker-host-check.yml"
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: worker-host/go.mod
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"
        working-directory: worker-host
      - name: Test
        run: go test -race ./...
        working-directory: worker-host
      - name: Vet
        run: go vet ./...
        working-directory: worker-host
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./...
        working-directory: worker-host
