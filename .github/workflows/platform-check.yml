name: ForgeOS platform checks
on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-check.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-check.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgeos
          POSTGRES_PASSWORD: forgeos_test
          POSTGRES_DB: forgeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeos -d forgeos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://forgeos:forgeos_test@127.0.0.1:5432/forgeos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: platform
      - run: npm run typecheck
        working-directory: platform
      - run: npm test
        working-directory: platform
      - run: npm run migrate:check
        working-directory: platform
      - run: npm run check:web
        working-directory: platform
      - run: npm run build
        working-directory: platform
